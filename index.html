</style></head><body><main><header class="top"><div class="logo">MOVE<span class="dot">.</span>BOARD</div><button class="round" onclick="showSettings()" aria-label="Einstellungen">⚙</button></header><section class="hero"><div class="eyebrow">YOUR TRAINING, YOUR FLOW</div><h1>Was steht heute an?</h1><p>Rosa ist offen. Grün ist geschafft. Trainiere in deinem Rhythmus – deine Kacheln merken sich alles.</p></section><nav class="nav" id="nav"></nav><div id="view"></div><div class="footer">MOVEBOARD · Deine Trainingsübersicht · Daten lokal auf diesem Gerät</div></main><div id="overlay" class="modalwrap hidden" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div><script>

let page='Übersicht',filter='Alle';function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(d){return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})}function cfg(cat){return state.settings[cat]||{mode:'manual',day:0,time:'20:00',carry:true,lastReset:Date.now()}}function autoReset(){let now=new Date();for(let cat of cats){let c=cfg(cat);if(c.mode!=='weekly')continue;let [hh,mm]=(c.time||'20:00').split(':').map(Number);let target=new Date(now);target.setHours(hh,mm,0,0);let diff=(target.getDay()-Number(c.day)+7)%7;target.setDate(target.getDate()-diff);if(target>now)target.setDate(target.getDate()-7);if((c.lastReset||0)<target.getTime())resetCategory(cat,true,target.getTime())}}function resetCategory(cat,automatic=false,at=Date.now()){let arr=state.exercises.filter(e=>e.cat===cat);state.history.push({cat,date:new Date(at).toISOString(),done:arr.filter(e=>e.done).length,total:arr.length,automatic});for(let e of arr)e.done=false;state.settings[cat]={...cfg(cat),lastReset:at};save()}function toggle(id){let e=state.exercises.find(x=>x.id===id);if(!e)return;e.done=!e.done;e.doneAt=e.done?new Date().toISOString():null;save();render()}function switchPage(p){page=p;filter='Alle';render();window.scrollTo({top:0,behavior:'smooth'})}function render(){autoReset();document.getElementById('nav').innerHTML=['Übersicht',...cats,'Kurse & Cardio'].map(x=>`<button class="${page===x?'active':''}" onclick="switchPage('${x}')">${esc(x)}</button>`).join('');let v=document.getElementById('view');if(page==='Übersicht'){v.innerHTML=`<h2 class="section-title">Deine Bereiche</h2><div class="category-grid">${cats.map(c=>{let es=state.exercises.filter(e=>e.cat===c),n=es.filter(e=>!e.done).length;return `<button class="category" onclick="switchPage('${c}')"><span class="icon">${icons[c]}</span><b>${c}</b><small>${n} offen · ${es.length-n} erledigt</small></button>`}).join('')}<button class="category" style="background:#f3bac5" onclick="switchPage('Kurse & Cardio')"><span class="icon">♥</span><b>Kurse & Cardio</b><small>${state.logs.length} Einträge</small></button></div><button class="add" onclick="showAdd()">＋ Neue Übung hinzufügen</button><div class="card"><b>Dein Prinzip</b><p class="hint">Die grünen Übungen bleiben über mehrere Trainingstage sichtbar. Jeder Bereich hat einen eigenen, einstellbaren Reset. Kurse werden separat mit Datum gespeichert.</p></div>`;return}if(page==='Kurse & Cardio'){v.innerHTML=`<div class="row"><h2 class="section-title">Kurse & Cardio</h2><span class="pill">${state.logs.length} Einträge</span></div><p class="muted">Tippe auf einen Kurs, um ihn für heute zu protokollieren.</p><div class="tiles">${classes.map((c,i)=>`<button class="tile open" style="background:${['#9bc9c7','#f3bac5','#f6dc7b','#d5c7e9','#cbe2cf','#f4c7ad'][i]}" onclick="logClass('${c}')"><span class="symbol">${['🏋️','⚡','🏃','⏱','🧘','🔥'][i]}</span><span class="status">＋</span><strong>${c}</strong><small>${c==='Norwegian 4×4'?'Geplant · bei Bedarf erfassen':'Training eintragen'}</small></button>`).join('')}</div><h3 class="section-title">Trainingsverlauf</h3><div class="card">${state.logs.length?state.logs.slice().reverse().map((x,i)=>`<div class="log"><div><b>${esc(x.name)}</b><div class="muted">${fmt(x.date)}</div></div><button class="smallbtn" onclick="removeLog(${state.logs.length-1-i})">Löschen</button></div>`).join(''):'<span class="muted">Noch keine Kurse erfasst.</span>'}</div>`;return}let es=state.exercises.filter(e=>e.cat===page),done=es.filter(e=>e.done).length;let muscles=['Alle',...new Set(es.map(e=>e.muscle))];if(!muscles.includes(filter))filter='Alle';let visible=es.filter(e=>filter==='Alle'||e.muscle===filter);v.innerHTML=`<div class="row"><h2 class="section-title">${icons[page]} ${page}</h2><button class="smallbtn" onclick="showSettings('${page}')">⚙ Zyklus</button></div><div class="row"><span class="muted">${done} von ${es.length} erledigt</span><span class="pill">${es.length-done} offen</span></div><div class="progress"><div style="width:${es.length?done/es.length*100:0}%"></div></div>${done===es.length&&es.length?'<div class="note">🎉 Alle Übungen geschafft! Du kannst den Zyklus jetzt zurücksetzen oder bis zu deinem eingestellten Termin warten.</div>':''}<div class="filter">${muscles.map(m=>`<button class="${m===filter?'active':''}" onclick="filter=${JSON.stringify(m).replace(/"/g,'&quot;')};render()">${esc(m)}</button>`).join('')}</div><div class="tiles">${visible.map(e=>`<button class="tile ${e.done?'done':'open'}" onclick="toggle('${e.id}')" title="Tippen zum Umschalten"><span class="symbol">${esc(e.icon||'🏋️')}</span><span class="status">${e.done?'✓':'○'}</span><strong>${esc(e.name)}</strong><small>${esc(e.muscle)}${e.doneAt&&e.done?' · '+fmt(e.doneAt):''}</small></button>`).join('')}</div><button class="add" onclick="showAdd('${page}')">＋ Neue Übung zu ${page} hinzufügen</button><div class="actions"><button class="secondary" onclick="showManage('${page}')">Übungen bearbeiten / löschen</button><button class="secondary" onclick="confirmReset('${page}')">↻ Zyklus zurücksetzen</button></div>`}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}function closeModal(){document.getElementById('overlay').classList.add('hidden')}function showAdd(cat=page){if(!cats.includes(cat))cat='Beine';openModal(`<div class="row"><h2>Neue Übung</h2><button class="round" onclick="closeModal()">×</button></div><form onsubmit="addExercise(event)"><div class="field"><label>Name der Übung</label><input name="name" required maxlength="90" placeholder="z. B. Cable Crunches"></div><div class="field"><label>Bereich</label><select name="cat">${cats.map(c=>`<option ${c===cat?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Muskelgruppe / Schwerpunkt</label><input name="muscle" placeholder="z. B. Quadrizeps" required></div><div class="field"><label>Symbol (Emoji)</label><input name="icon" maxlength="6" value="🏋️"></div><button class="primary" type="submit">＋ Übung speichern</button></form>`)}function addExercise(ev){ev.preventDefault();let f=new FormData(ev.target);state.exercises.push({id:'u'+Date.now(),name:f.get('name').trim(),cat:f.get('cat'),muscle:f.get('muscle').trim(),icon:f.get('icon')||'🏋️',done:false,doneAt:null});save();closeModal();page=f.get('cat');filter='Alle';render()}function showManage(cat){let es=state.exercises.filter(e=>e.cat===cat);openModal(`<div class="row"><h2>${cat} bearbeiten</h2><button class="round" onclick="closeModal()">×</button></div>${es.map(e=>`<div class="log"><span>${esc(e.name)}</span><div><button class="smallbtn" onclick="editExercise('${e.id}')">Ändern</button><button class="smallbtn" style="color:#c52840" onclick="deleteExercise('${e.id}')">×</button></div></div>`).join('')}`)}function editExercise(id){let e=state.exercises.find(x=>x.id===id);if(!e)return;openModal(`<div class="row"><h2>Übung ändern</h2><button class="round" onclick="closeModal()">×</button></div><form onsubmit="saveEdit(event,'${id}')"><div class="field"><label>Name</label><input name="name" required value="${esc(e.name)}"></div><div class="field"><label>Bereich</label><select name="cat">${cats.map(c=>`<option ${c===e.cat?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Muskelgruppe</label><input name="muscle" required value="${esc(e.muscle)}"></div><div class="field"><label>Symbol</label><input name="icon" value="${esc(e.icon)}"></div><button class="primary">Speichern</button></form>`)}function saveEdit(ev,id){ev.preventDefault();let e=state.exercises.find(x=>x.id===id),f=new FormData(ev.target);for(let k of ['name','cat','muscle','icon'])e[k]=f.get(k);save();closeModal();render()}function deleteExercise(id){if(!confirm('Diese Übung wirklich löschen?'))return;let e=state.exercises.find(x=>x.id===id);state.exercises=state.exercises.filter(x=>x.id!==id);save();showManage(e.cat);render()}function logClass(name){state.logs.push({name,date:new Date().toISOString()});save();render()}function removeLog(i){if(!confirm('Eintrag löschen?'))return;state.logs.splice(i,1);save();render()}function confirmReset(cat){if(confirm(`Alle Übungen in ${cat} wieder als offen markieren?`)){resetCategory(cat);render()}}function showSettings(cat){let c=cat||'Beine',s=cfg(c);openModal(`<div class="row"><h2>Trainingszyklen</h2><button class="round" onclick="closeModal()">×</button></div><p class="hint">Jeder Bereich wird unabhängig zurückgesetzt. Ein wöchentlicher Reset erfolgt beim nächsten Öffnen der App nach dem eingestellten Termin.</p><div class="field"><label>Bereich</label><select id="setcat" onchange="showSettings(this.value)">${cats.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('')}</select></div><form onsubmit="saveSettings(event,'${c}')"><div class="field"><label>Reset-Art</label><select name="mode"><option value="manual" ${s.mode==='manual'?'selected':''}>Nur manuell</option><option value="weekly" ${s.mode==='weekly'?'selected':''}>Wöchentlich nach Zeitplan</option></select></div><div class="field"><label>Wochentag</label><select name="day">${['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'].map((x,i)=>`<option value="${i}" ${Number(s.day)===i?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Uhrzeit</label><input type="time" name="time" value="${s.time||'20:00'}"></div><div class="note">Beim Reset werden die Kacheln wieder rosa. Ein Zyklusabschluss wird im Archiv vermerkt. Nicht erledigte Übungen bleiben als offene Aufgaben im neuen Zyklus sichtbar.</div><p><button class="primary">Einstellungen speichern</button></p></form><button class="secondary" onclick="confirmReset('${c}');closeModal()">${c} jetzt zurücksetzen</button><h3>Abgeschlossene Zyklen</h3>${state.history.filter(x=>x.cat===c).slice(-5).reverse().map(x=>`<div class="log"><span>${fmt(x.date)}</span><b>${x.done}/${x.total}</b></div>`).join('')||'<p class="muted">Noch keine abgeschlossenen Zyklen</p>'}`)}function saveSettings(ev,cat){ev.preventDefault();let f=new FormData(ev.target);state.settings[cat]={...cfg(cat),mode:f.get('mode'),day:Number(f.get('day')),time:f.get('time'),lastReset:Date.now()};save();closeModal();render()}render();</script></body></html>
